<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <title>PYCAD Embed</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <div id="root">
      <div
        role="status"
        aria-live="polite"
        style="
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 16px;
          min-height: 100vh;
          margin: 0;
          background: #0a0b0d;
          color: #e6e9ef;
          font: 600 15px/1.4 system-ui, sans-serif;
          text-align: center;
          padding: 24px;
          box-sizing: border-box;
        "
      >
        <div
          aria-hidden="true"
          style="
            width: 28px;
            height: 28px;
            border: 2px solid #3a4150;
            border-top-color: #c9a227;
            border-radius: 50%;
            animation: pycad-boot-spin 0.8s linear infinite;
          "
        ></div>
        <p style="margin: 0">Connecting to the demo…</p>
      </div>
    </div>
    <style>
      @keyframes pycad-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <!--PYCAD_BOOTSTRAP-->
    <script type="module" src="/src/embed-main.tsx"></script>
  </body>
</html>
